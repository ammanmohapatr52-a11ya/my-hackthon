services:
  - type: web
    name: my-hackthon
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEFAULT_PROVIDER
        value: openrouter
      - key: OPENROUTER_MODEL
        value: liquid/lfm-2.5-2.6b:free
      - key: VERIFIER_ENABLED
        value: "false"
      - key: BREVO_SENDER_EMAIL
        value: neurobridge123@gmail.com
      - key: BREVO_SENDER_NAME
        value: Neurobridge Stark Academy
      - key: BREVO_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
